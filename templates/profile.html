
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <div class="dashboard">
        <header class="topbar">
            <h1>Student Dashboard</h1>
            <a class="button-link" href="{{ url_for('logout') }}">Logout</a>
        </header>

        <div class="card">
            <h2>Welcome, {{ student.name }}!</h2>
            <p>Current Time: <strong id="clock"></strong></p>

            <button type="button" id="toggleBtn">Show/Hide Details</button>

            <div id="studentDetails">
                <p><strong>Name:</strong> {{ student.name }}</p>
                <p><strong>Email:</strong> {{ student.email }}</p>
                <p><strong>Age:</strong> {{ student.age }}</p>
                <p><strong>Gender:</strong> {{ student.gender }}</p>
                <p><strong>Course:</strong> <span id="currentCourse">{{ student.course }}</span></p>
            </div>
        </div>

        <div class="card">
            <h2>Update Course</h2>

            <form id="courseForm">
                <label for="course">Choose a course</label>
                <select name="course" id="course" required>
                    {% for course in courses %}
                        <option value="{{ course }}"
                            {% if course == student.course %}selected{% endif %}>
                            {{ course }}
                        </option>
                    {% endfor %}
                </select>

                <button type="submit">Update Course</button>
            </form>

            <p id="message" role="status"></p>
        </div>
    </div>
</body>
</html>
